name: Integrar chamados V7.81.66 (teste)
on:
  push:
    paths:
      - '.github/workflows/integrar-chamados-v78166.yml'
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar JavaScript e integrar somente referência
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/guia-chamados-v7.81.66.js
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path=Path('teste-multimidia.html')
          original=path.read_bytes()
          expected='71dacdf4a5c710104967385973cb16e76fea4da8'
          current=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          if current != expected:
              raise SystemExit(f'Arquivo de testes mudou; revisão manual necessária: {current}')
          marker=b'</body></html>'
          if not original.endswith(marker):
              raise SystemExit('Fechamento HTML inesperado')
          tag=b'\n<!-- V7.81.66 TESTE: progresso dos chamados, integracao nativa -->\n<script src="./assets/guia-chamados-v7.81.66.js" defer></script>\n'
          if tag in original:
              raise SystemExit('Integração já aplicada')
          novo=original[:-len(marker)]+tag+marker
          assert novo.replace(tag,b'')==original
          path.write_bytes(novo)
          print('HTML atualizado somente com referência ao script; dados musicais preservados')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teste-multimidia.html
          git commit -m "V7.81.66 TESTE: integrar barra de chamados e preservar mídias YouTube"
          git push
